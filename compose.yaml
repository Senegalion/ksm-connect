name: ksm-connect

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ksm_connect
      POSTGRES_USER: ${DATABASE_USERNAME:-ksm}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ksm_connect
      DATABASE_USERNAME: ${DATABASE_USERNAME:-ksm}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?Set TOKEN_PEPPER in .env}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_BASE_URL:-http://localhost:5173}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-KSM Connect <no-reply@ksm.local>}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMSAPI_TOKEN: ${SMSAPI_TOKEN:-}
      SMS_SENDER_NAME: ${SMS_SENDER_NAME:-}
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
