spring:
  application:
    name: ksm-connect
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ksm_connect}
    username: ${DATABASE_USERNAME:ksm}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000
  jackson:
    default-property-inclusion: non_null
  thymeleaf:
    check-template-location: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

ksm:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  token-pepper: ${TOKEN_PEPPER:}
  privacy-notice-version: "2026-11"
  default-timezone: Europe/Warsaw
  security:
    session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
    client-ip-header: ${CLIENT_IP_HEADER:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    rate-limiting-enabled: ${RATE_LIMITING_ENABLED:true}
  auth:
    email-verification-ttl: 24h
    password-reset-ttl: 1h
    max-failed-logins: 5
    lockout-duration: 15m
  notification:
    mail-from: ${MAIL_FROM:KSM Connect <no-reply@localhost>}
    sms-provider: ${SMS_PROVIDER:none}
    sms-api-token: ${SMSAPI_TOKEN:}
    sms-sender-name: ${SMS_SENDER_NAME:}
    max-attempts: 8
    initial-backoff: 30s
    max-backoff: 2h
    batch-size: 20
    processing-timeout: 5m
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    lifecycle-interval: PT30S
    outbox-interval: PT10S
    retention-interval: PT6H
  retention:
    days-after-event: 90
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    acs-endpoint: ${ACS_ENDPOINT:}
    acs-sender-address: ${ACS_SENDER_ADDRESS:}
    managed-identity-client-id: ${AZURE_CLIENT_ID:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
