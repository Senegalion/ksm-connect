server:
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

spring:
  mail:
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS:true}

logging:
  structured:
    format:
      console: ecs

ksm:
  security:
    session-cookie-secure: true
    client-ip-header: ${CLIENT_IP_HEADER:X-Forwarded-For}
