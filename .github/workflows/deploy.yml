name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    if: vars.ACR_NAME != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure login (build identity, OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reuse image if this commit was already published
        id: existing
        run: |
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "ksm-connect:${GITHUB_SHA}" --query digest -o tsv 2>/dev/null || true)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Build image
        if: steps.existing.outputs.digest == ''
        run: docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${{ vars.ACR_LOGIN_SERVER }}/ksm-connect:${GITHUB_SHA}" .
      - name: Scan image before publishing
        if: steps.existing.outputs.digest == ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/ksm-connect:${{ github.sha }}
          scanners: vuln
          timeout: 15m
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push image and lock tag
        if: steps.existing.outputs.digest == ''
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/ksm-connect:${GITHUB_SHA}"
          az acr repository update --name "${{ vars.ACR_NAME }}" --image "ksm-connect:${GITHUB_SHA}" --write-enabled false --delete-enabled false >/dev/null
      - name: Resolve immutable digest
        id: push
        run: |
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "ksm-connect:${GITHUB_SHA}" --query digest -o tsv)"
          image="${{ vars.ACR_LOGIN_SERVER }}/ksm-connect@${digest}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${image}\` (commit \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: test
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Azure login (TEST deploy identity, OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy image to TEST
        run: ./infra/scripts/rollout.sh "${{ vars.RESOURCE_GROUP }}" "${{ vars.APP_NAME }}" "${{ needs.build.outputs.image }}"
      - name: Smoke tests
        run: ./infra/scripts/smoke-test.sh "${{ vars.APP_URL }}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests against TEST
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.APP_URL }}
          MAILPIT_URL: ${{ vars.MAILPIT_URL }}
          MAILPIT_USER: ksm
          MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test --project=desktop --project=mobile-360
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-test
          path: frontend/playwright-report
      - name: OWASP ZAP baseline (passive) scan of TEST
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.APP_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-test

  deploy-prod:
    needs: [build, deploy-test]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Azure login (PROD deploy identity, OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Promote the image verified in TEST to PROD
        run: ./infra/scripts/rollout.sh "${{ vars.RESOURCE_GROUP }}" "${{ vars.APP_NAME }}" "${{ needs.build.outputs.image }}"
      - name: Production smoke tests (read-only)
        run: ./infra/scripts/smoke-test.sh "${{ vars.APP_URL }}"
