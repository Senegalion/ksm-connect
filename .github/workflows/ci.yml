name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve dependencies
        run: mvn -B -q dependency:go-offline
      - name: Unit and integration tests (Testcontainers)
        run: mvn -B verify
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import csv, pathlib
          report = pathlib.Path("target/site/jacoco/jacoco.csv")
          if report.exists():
              rows = list(csv.DictReader(report.open()))
              missed = sum(int(r["LINE_MISSED"]) for r in rows)
              covered = sum(int(r["LINE_COVERED"]) for r in rows)
              print(f"### Backend line coverage: {100 * covered / max(1, missed + covered):.1f}%")
          PYTHON
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  security-scan:
    runs-on: ubuntu-24.04
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve Maven dependencies from cache for the scanner
        working-directory: backend
        run: mvn -B -q dependency:go-offline
      - name: Scan dependencies, secrets and infrastructure code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: frontend/node_modules,backend/target
          timeout: 15m
          exit-code: '1'

  container:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build application image (cached layers)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: ksm-connect:${{ github.sha }}
          cache-from: type=gha,scope=ksm-connect
          cache-to: type=gha,scope=ksm-connect,mode=max
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ksm-connect:${{ github.sha }}
          scanners: vuln
          timeout: 15m
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s#^DATABASE_PASSWORD=.*#DATABASE_PASSWORD=$(openssl rand -hex 16)#" .env
          sed -i "s#^TOKEN_PEPPER=.*#TOKEN_PEPPER=$(openssl rand -hex 32)#" .env
          sed -i "s#^RATE_LIMITING_ENABLED=.*#RATE_LIMITING_ENABLED=false#" .env
          sed -i "s#^FRONTEND_BASE_URL=.*#FRONTEND_BASE_URL=http://localhost:8080#" .env
      - name: Start application stack
        run: docker compose up -d --build --wait
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests against the application container
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ci
          path: frontend/playwright-report
      - name: Application logs on failure
        if: failure()
        run: docker compose logs backend
